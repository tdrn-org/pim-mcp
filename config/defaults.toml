[logging]
level = "info"
target = "stdout"
color = "auto"
file_name = "./pim-mcp.log"
file_size_limit = 0
syslog_network = "unixgram"
syslog_address = "/dev/log"
syslog_encoding = "local"
syslog_facility = 4

[server]
address = "localhost:0"
protocol = "http"
cert_file = ""
key_file = ""
public_url = ""
trusted_proxies = [ ]
trusted_headers = [ ]
allowed_origins = [ ]
access_log = ""
access_log_size_limit = 0
session_cookie_name = "pim-mcp-session"

[store]
type = "memory"

[store.memory]

[store.sqlite]
file = "./pim-mcp.db"

[pim]
adapter = "demo"
access_mode = "read_only"

[pim.msgraph]
client_id = ""
client_secret = ""
tenant_id = ""
sensitivity_limit = 0

[dms]
adapter = "none"

[dms.paperlessngx]
api_url = ""
api_key = ""
